<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
  <title>{% block title %}Mantuí{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='img/icone-do-mantui.png') }}">
</head>

<body class="min-h-screen">

    {% include "partials/header_public.html" %}

  <!-- QUESTÃO DOS FLASHES PRECISA SER AJUSTADA -->
  {% set mensagens = get_flashed_messages(with_categories=True) %} 
    {% if mensagens %}     
      {% for category, message in mensagens %}
        <div class="font-bold p-4 
        {% if category == 'success' %}
          bg-green-50 text-green-800
        {% elif category == 'danger' %}
          bg-red-50 text-red-800
        {% else %}
          bg-blue-50 text-blue-800
        {% endif %}
        ">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

</body>

</html>
