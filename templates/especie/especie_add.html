<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="{{url_for('especie.add')}}" method="POST">

        Nome Comum: <input type="text" name="nome_comum"><br/>
        Nome Científico: <input type="text" name="nome_cientifico"><br/>
        Status Conservação: <select name="fk_id_especie" id="">
            <option value="">Selecione um status</option>
            {% for status in status_conservacao %}
                <option value="{{ status_conservacao.id }}">{{ status_conservacao.categoria }}</option>
            {% endfor %}
        </select>
        <input type="submit" name="Cadastrar">

    </form>
</body>
</html>
