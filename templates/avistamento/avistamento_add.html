<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>{% block title %}Novo Avistamento{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='img/icone-do-mantui.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
</head>
<body class="bg-neutro-mantui-50 min-h-screen">

    {% include "partials_private/header_lock.html" %}

    <main class="w-full my-auto flex justify-center desktop:justify-center p-3 mb-3">


    <div class="w-full text-neutro-mantui-950 p-6 flex flex-col justify-center items-center">
        <div class="w-full flex items-center justify-end gap-3">

            <a href="{{ url_for('usuario.home') }}" class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 hover:bg-neutro-mantui-200 focus:outline-none focus:border-laranja-mantui-500 text-center font-medium transition-colors">
                Cancelar
            </a>

            <input type="submit" name="cadastrar" value="Fazer Avistamento" class="px-4 py-2 rounded text-neutro-mantui-50 border-3 border-transparent bg-neutro-mantui-950 hover:bg-laranja-mantui-500 cursor-pointer font-medium transition-colors">
        </div>

    <form class="w-full flex flex-col gap-4 max-w-xl p-2" action="{{url_for('avistamento.add')}}" method="POST" enctype="multipart/form-data">

            <div class="text-center space-y-3 py-center mb-2 mt-4">
                <h2 class="font-sans font-medium text-neutro-mantui-950 text-2xl leading-none">Avistamento</h2>
                <p class="font-lato text-neutro-mantui-700">Preencha os dados e registre o seu novo avistamento.</p>
            </div>
        

            <section class="w-full space-y-6 py-4 border-b border-neutro-mantui-200 border-t">

            <div class="flex flex-col gap-1">
                <p>
                <label class="font-lato font-medium text-neutro-mantui-950">Título</label>
                </p>
                <input type="text" placeholder="Ex: 'Garça-branca-grande em área alagada'" class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 focus:outline-none focus:border-laranja-mantui-500" name="nome">
            </div>

            <div class="flex flex-col gap-2">
    
                <div class="relative border-3 border-dashed border-neutro-mantui-600 rounded-2xl p-8 flex flex-col items-center justify-center text-center group hover:border-orange-500 transition-colors cursor-pointer bg-laranja-mantui-50/50">
                    
                    <input type="file" id="input-midia" name="midia" accept="image/*,audio/*,video/*" multiple onchange="atualizarPreviewMidiast(this)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">

                    <div class="mb-3 text-neutro-mantui-950">
                        <svg class="w-12 h-12 stroke-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="3" ry="3" stroke-width="2"/>
                            <path d="M8.5 10a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" stroke-width="2"/>
                            <path d="M21 15l-5-5L5 21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>

                    <h3 class="text-base font-lato font-bold text-neutro-mantui-950 mb-1">Baixar Mídia</h3>
                    <p class="text-xs text-neutro-mantui-950 max-w-xs leading-relaxed mb-4">
                        Faça Upload de Imagens, Vídeos e Áudios<br> 
                        das espécies que você Avistou
                    </p>

                    <button type="button" class="bg-orange-600 hover:bg-orange-500 text-laranja-mantui-50 font-medium px-8 py-2.5 rounded-md text-sm transition-colors pointer-events-none">
                        Selecionar Arquivos
                    </button>
                </div>

                <div id="container-preview-midias" class="hidden flex-col gap-2 mt-2">
                    <span id="contador-arquivos" class="text-xs font-lato font-bold text-neutro-mantui-950"></span>
                    
                    <div id="lista-arquivos-nomes" class="flex flex-wrap gap-2"></div>
                </div>
            </div>

            </section>

            <section class="w-full space-y-6 py-4 border-b border-neutro-mantui-200">

                <div class="flex flex-col gap-1">
                    <p>
                    <label class="font-lato font-medium text-neutro-mantui-950">Descrição</label>
                    </p>
                    <input type="text" placeholder="Adicionar Descrição" class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 focus:outline-none focus:border-laranja-mantui-500" name="observacoes">
                </div>

                <div class="flex flex-col gap-1">
                    <p>
                        <label class="text-lato font-medium text-neutro-mantui-950">Espécie</label>
                    </p>
            
                        <select class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 focus:outline-none focus:border-laranja-mantui-500" id="select-especie" name="fk_id_especie">
                            <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="">Espécie não Identificada</option>
                            {% for especie in especies %}
                                <option value="{{ especie.id }}">{{ especie.nome_comum }}</option>
                            {% endfor %}
                        </select>
                </div>

                <div class="flex flex-col gap-1">
                    <p>
                        <label class="font-lato font-medium text-neutro-mantui-950">Bioma</label>
                    </p>
                    <select class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 focus:outline-none focus:border-laranja-mantui-500" name="bioma" id="">
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Bioma não Identificado">Bioma não Identificado</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Amazônia">Amazônia</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Cerrado">Cerrado</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Caatinga">Caatinga</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Mata Atlântica">Mata Atlântica</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Pantanal">Pantanal</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Pampa">Pampa</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <p>
                            <!-- Era pra ser estado, com uma lista: -->
                    <label class="font-lato font-medium text-neutro-mantui-950">Latitude</label>
                    </p>
                    <input type="number" placeholder="Latitude" class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 focus:outline-none focus:border-laranja-mantui-500" name="latitude">
                </div>

                <div class="flex flex-col">
                    <p>
                            <!-- Era pra ser município, com uma lista: -->
                    <label class="font-lato font-medium text-neutro-mantui-950">Longitude</label>
                    </p>
                    <input type="number" placeholder="Longitude" class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 focus:outline-none focus:border-laranja-mantui-500" name="longitude">
                </div>

                <div class="grid grid-cols-1 tablet:grid-cols-2 gap-1.5 w-full">

                    <div class="flex flex-col">
                    <p>
                    <label class="font-lato font-medium text-neutro-mantui-950">Condição Climática</label>
                    </p>
                    <select class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 focus:outline-none focus:border-laranja-mantui-500" name="cond_clima" id="">
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Clima não Identificado">Clima não Identificado</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Ensolarado">Ensolarado</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Nublado">Nublado</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Parcialmente Nublado">Parcialmente Nublado</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Chuva Leve">Chuva Leve</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Chuva Forte">Chuva Forte</option>
                    </select>
                    </div>

                <div class="flex flex-col">
                    <p>
                    <label class="font-lato font-medium text-neutro-mantui-950">Condição do Vento</label>
                    </p>
                    <select class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 focus:outline-none focus:border-laranja-mantui-500" name="cond_ventos" id="">
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Vento não Identificada">Vento não Identificada</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Calmo">Calmo</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Vento Leve">Vento Leve</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Vento Moderado">Vento Moderado</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Vento Forte">Vento Forte</option>
                        <option class="bg-laranja-mantui-50 text-neutro-mantui-950 py-2" value="Vento Muito Forte">Vento Muito Forte</option>
                    </select>
                    </div>

                </div>

            </section>

            <section class="w-full space-y-6 py-4 border-b border-neutro-mantui-200">

                <div class="flex flex-col">
                    <p>
                    <label class="font-lato font-medium text-neutro-mantui-950">Data e Hora</label>
                    </p>
                    <input type="datetime-local" class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 focus:outline-none focus:border-laranja-mantui-500" name="data_hora">
                </div>


                <div class="flex flex-col">
                    <p>
                    <label class="font-lato font-medium text-neutro-mantui-950">Pesquisador(es)</label>
                    </p>
                    
                    <input placeholder="{{ current_user.nome if current_user else 'Utilizador' }}" type="text" class="px-4 py-2 rounded text-neutro-mantui-950 border-3 border-neutro-mantui-400 focus:outline-none focus:border-laranja-mantui-500" name="current_user">
                </div>

            </section>

            <!-- Não sei bem o que fazer com isso: -->
        <!-- Tipo Registro: <input type="text" name="tipo_registro"><br/> -->

                <div class="flex flex-col">
                    <input type="submit" class="px-4 py-2 rounded text-neutro-mantui-50 border-3 hover:bg-laranja-mantui-500 to bg-neutro-mantui-950" name="cadastrar" value="Fazer Avistamento">
                </div>

        <!-- <input type="submit" name="cadastrar"> -->

    </form>
    </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script>
        new TomSelect("#select-especie", {
            placeholder: "Digite para buscar a espécie...",
            maxOptions: null
        });
    </script>

    <script>
        // DataTransfer global para acumular todos os arquivos selecionados
        const dt = new DataTransfer();
        const inputMidia = document.getElementById('input-midia');

        if (inputMidia) {
            inputMidia.addEventListener('change', function () {
                // Adiciona cada novo arquivo selecionado ao container acumulador
                for (let file of this.files) {
                    dt.items.add(file);
                }

                // Atualiza a lista real do input para o envio do formulário
                this.files = dt.files;

                atualizarInterfaceMidias();
            });
        }

        function atualizarInterfaceMidias() {
            const container = document.getElementById('container-preview-midias');
            const contador = document.getElementById('contador-arquivos');
            const lista = document.getElementById('lista-arquivos-nomes');

            lista.innerHTML = '';

            if (dt.files.length > 0) {
                container.classList.remove('hidden');
                container.classList.add('flex');

                const total = dt.files.length;
                contador.innerText = `${total} arquivo${total > 1 ? 's' : ''} selecionado${total > 1 ? 's' : ''}:`;

                Array.from(dt.files).forEach((file, index) => {
                    const badge = document.createElement('span');
                    badge.className = 'text-xs bg-verde-mantui-600 text-neutro-mantui-50 px-3 py-1 rounded-sm font-lato flex items-center gap-1.5 truncate max-w-[220px]';

                    badge.innerHTML = `
                        <span class="truncate">${file.name}</span>
                        <button type="button" onclick="removerArquivoMidia(${index})" class="text-amarelo-mantui-600 hover:text-amarelo-mantui-700 font-bold ml-1 cursor-pointer z-20">&times;</button>
                    `;
                    lista.appendChild(badge);
                });
            } else {
                container.classList.add('hidden');
                container.classList.remove('flex');
            }
        }

        // Função para remover um arquivo individual da lista acumulada
        function removerArquivoMidia(index) {
            dt.items.remove(index);
            inputMidia.files = dt.files;
            atualizarInterfaceMidias();
        }
    </script>

</body>
</html>
