<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="{{url_for('avistamento.add')}}" method="POST">

        Nome: <input type="text" name="nome"><br/>
        Latitude: <input type="number" name="latitude"><br/>
        Longitude: <input type="number" name="longitude"><br/>
        Bioma: <input type="text" name="bioma"><br/>
        Tipo Registro: <input type="text" name="tipo_registro"><br/>
        Condição Climática: <input type="text" name="cond_clima"><br/>
        Condição Ventos: <input type="text" name="cond_ventos"><br/>
        Observações:  <input type="text" name="observacoes"><br/>
        
        <!-- ID Espécie: <input type="number" name="fk_id_especie"><br/> -->
        ID Espécie: <select name="fk_id_especie" id="">
            <option value="">Selecione uma espécie</option>
            {% for especie in especies %}
                <option value="">{{ especie.nome_comum }}</option>
            {% endfor %}
        </select>

        <input type="submit" name="Adicionar">

    </form>
</body>
</html>
