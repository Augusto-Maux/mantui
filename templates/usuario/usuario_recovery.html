<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

	{% set mensagens = get_flashed_messages(with_categories=True) %} 
        {% if mensagens %}     
            {% for category, message in mensagens %}
                <div class="font-bold p-4 
                    {% if category == 'success' %}
                        bg-green-50 text-green-800
                    {% elif category == 'danger' %}
                        bg-red-50 text-red-800
                    {% else %}
                        bg-blue-50 text-blue-800
                    {% endif %}">
                        {{ message }}
                </div>
            {% endfor %}
        {% endif %}  

    <table class="table">

		<thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
            </tr>
		</thead>

		<tbody>			
			{% for u in usuarios %}
			<tr>
				<td>{{u.id}}</td>
				<td>{{u.nome}}</td>
				<td>{{u.email}}</td>
			</tr>
			{% endfor %}
		</tbody>
	</table>

</body>
</html>
