<form action="{{url_for('usuario.update', id=user.id)}}" method="POST" enctype="multipart/form-data">
        
        Nome: <input type="text" name="nome" value="{{ user.nome }}"><br/>
        E-mail: <input type="email" name="email" value="{{ user.email }}"><br/>
        Foto de Perfil: <input type="file" name="foto_perfil" accept="image/png,image/jpeg,image/webp">
        <input type="submit" name="Atualizar">
    
    </form>
