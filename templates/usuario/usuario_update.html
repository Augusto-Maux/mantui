<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Usuário</title>
</head>
<body>
    <form action="{{url_for('usuario.update', id=user.id)}}" method="POST">
        
        Nome: <input type="text" name="nome" value="{{ user.nome }}"><br/>
        E-mail: <input type="email" name="email" value="{{ user.email }}"><br/>
         
        <input type="submit" name="Atualizar">
    
    </form>
</body>
</html>
