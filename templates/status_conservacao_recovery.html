<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table class="table">

		<thead>
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Observações</th>
                <th>Fonte</th>
            </tr>
		</thead>

		<tbody>			
			{% for status in status_conservacao %}
			<tr>
				<td>{{status.id}}</td>
				<td>{{status.descricao}}</td>
				<td>{{status.categoria}}</td>
                <td>{{status.observacoes}}</td>
                <td>{{status.fonte}}</td>
			</tr>
			{% endfor %}
		</tbody>
	</table>
</body>
</html>
